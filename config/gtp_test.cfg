# Minimal GTP / benchmark config for inverse gomoku (KataGomo newgame_gomokuamazons + white-restrict)
logDir = gtp_logs
logSearchInfo = false
logMoves = false
logAllGTPCommunication = false

# Rules: inverse gomoku (five in a row loses). White-restriction is configurable.
rules = tromp-taylor
whiteRestrictTurns = 2

# Search / resource settings for a laptop GPU
numSearchThreads = 4
nnMaxBatchSize = 256
maxVisits = 8000
ponderingEnabled = false

# Device
openclDeviceToUse = 0
openclGpuToUse = 0

# 必杀距离效用: 终局值按距搜索根步数缩放(赢越早/输越晚效用越高),0=关闭纯二值
mateDistanceUtilityScale = 0.25
