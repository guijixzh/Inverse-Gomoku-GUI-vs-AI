[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antifive"
version = "2.5.0"
description = "逆五子棋 AI 对战 GUI:规则引擎、MCTS、启发式 AI、自研策略价值网络与 KataGo 集成"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "guijixzh (硅基飙尘葆光)", email = "guijixzh@gmail.com" },
]
keywords = ["gomoku", "inverse-gomoku", "alphazero", "mcts", "katago", "pygame"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
gui = ["pygame>=2.5"]
nn = ["torch>=2.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/guijixzh/Inverse-Gomoku-GUI-vs-AI"
Repository = "https://github.com/guijixzh/Inverse-Gomoku-GUI-vs-AI"

[project.scripts]
antifive = "antifive.gui:main"
antifive-play = "antifive.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# 包内调优参数随 wheel 分发:Pyodide(网页)只加载 wheel 内资源,
# 没有仓库 data/ 目录,必须靠 antifive/params.json 才能吃到调优参数。
[tool.setuptools.package-data]
antifive = ["params.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
